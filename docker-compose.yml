version: '3.8'

services:
  # --- 1. DỊCH VỤ DATABASE (MySQL) ---
  mysql-db:
    image: mysql:8.0
    container_name: banking_mysql
    environment:
      MYSQL_ROOT_PASSWORD: NeumotngayNguoiemyeuvoivang2710@@
      MYSQL_DATABASE: banking_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql  # Giữ lại dữ liệu kể cả khi xoá container
    command: --default-authentication-plugin=mysql_native_password

  # --- 2. DỊCH VỤ BACKEND (Spring Boot) ---
  banking-api:
    build: ./backend # Trỏ đến Dockerfile trong thư mục backend
    container_name: banking_api
    ports:
      - "8080:8080"
    environment:
      # Thay vì dùng IP, ta chỉ cần gọi tên service "mysql-db".
      # Docker network sẽ tự động phân giải tên này thành IP nội bộ.
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_DATABASE=banking_db
      - DB_USERNAME=root
      - DB_PASSWORD=NeumotngayNguoiemyeuvoivang2710@@
      - JWT_SECRET=bW90LWNodW9pLWJpLW1hdC1iYXQta3ktZGFpLWhvbi0zMi1reS10dS1kYW5oLWNoby1kdS1hbi1iYW5raW5n
    depends_on:
      - mysql-db # Đợi MySQL khởi động xong thì Spring Boot mới được chạy

# Khai báo ổ cứng ảo để lưu data
volumes:
  mysql_data: